name: Unzip site files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip fast-load v2 build
        run: |
          unzip -o SP_PAPIYA_FASHION_Fast_Load_v2.zip
          rm -f SP_PAPIYA_FASHION_Fast_Load_v2.zip
          ls -l index.html assets/opt/p01.jpg
      - name: Commit extracted files
        run: |
          git config user.name "arian231"
          git config user.email "arian231@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Extract SP PAPIYA FASHION fast-load v2 build" || echo "Nothing to commit"
          git push
